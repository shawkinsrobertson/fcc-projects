<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do Shit</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main>
    <div class="menu-sidebar">
      <div id="sidebar-header">
        <div id="logo"></div>
        <h2 id="wordmark">Do Shit</h2>
        <button id="sidebar-close-btn" aria-label="close" type="button">X</button>
      </div>
      <div class="projects">
        <h3>Projects</h3>
        <button id="delete-projects-btn" class="btn">delete projects</button>
        <div id="project-container">
        </div>
      </div>
      <div class="lists">
        <h3>Lists</h3>
        <button id="delete-lists-btn" class="btn">delete lists</button>
        <div id="list-container">
          
        </div>
      </div>
    </div>
    <div class="todo-app">
      <header class="title-and-primarybtn">
        <h1>Do Shit</h1>
        <div class="menu-wrapper">
          <button id="add-new-btn" type='button' aria-label='create new item' aria-controls='button dropdown' aria-expanded="false">Create</button>
          <div id="button-dropdown" class="menu-panel">
            <button id="open-task-form-btn" type="btn">New Task</button>
            <button id="open-project-form-btn" type="btn">New Project</button>
            <button id="open-list-form-btn" type="btn">New List</button>
          </div>
        </div>
    </header>
      <div id="task-form-home">
        <form class="form hidden" id="task-form">
          <div class="task-form-header">
            <button id="close-task-form-btn" class="close-task-form-btn" type="button" aria-label="close">
              <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#F44336" d="M21.5 4.5H26.501V43.5H21.5z" transform="rotate(45.001 24 24)" /><path fill="#F44336" d="M21.5 4.5H26.5V43.501H21.5z" transform="rotate(135.008 24 24)" /></svg>
            </button>
          </div>
          <div class="task-form-body">
              <label class="form-label" for="task-title-input">Name</label>
              <input required type="text" class="form-control" id="task-title-input" value="" />
              <label class="form-label" for="task-date-input">Date</label>
              <input type="date" class="form-control" id="task-date-input" value="" />
              <label class="form-label" for="task-project-input">Project</label>
              <input type="text" class="form-control" id="task-project-input" value="" />
              <label class="form-label" for="task-list-input">List</label>
              <input type="text" class="form-control" id="task-list-input" value="" />
              <label class="form-label" for="task-parent-input">Parent task?</label>
              <input type="text" class="form-control" id="task-parent-input" value="" />
              <label class="form-label" for="task-description-input">Description</label>
              <textarea class="form-control" id="task-description-input" cols="30" rows="5"></textarea>
          </div>
          <div class="task-form-footer">
            <button id="add-or-update-task-btn" class="btn large-btn" type="submit">
              Add Task
            </button>
          </div>
        </form>
      </div>
      <form class="form hidden" id="project-form">
        <div class="project-form-header">
          <button id="close-project-form-btn" class="close-task-form-btn" type="button" aria-label="close">
            <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#F44336" d="M21.5 4.5H26.501V43.5H21.5z" transform="rotate(45.001 24 24)" /><path fill="#F44336" d="M21.5 4.5H26.5V43.501H21.5z" transform="rotate(135.008 24 24)" /></svg>
          </button>
        </div>
        <div class ='project-form-body'>
          <label class="form-label" for="project-title-input">Name</label>
              <input required type="text" class="form-control" id="project-title-input" value="" />
            <label class="form-label" for="project-date-input">Date</label>
              <input type="date" class="form-control" id="project-date-input" value="" />
            <label class="form-label" for="project-description-input">Description</label>
              <textarea class="form-control" id="project-description-input" cols="30" rows="5"></textarea>
          </div>
            <div class="form-footer">
          <button id="add-or-update-project-btn" class="btn large-btn" type="submit">
            Create Project
          </button>
        </div>
      </form>
      <form class="form hidden" id="list-form">
        <div class="list-form-header">
          <button id="close-list-form-btn" class="close-task-form-btn" type="button" aria-label="close">
            <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#F44336" d="M21.5 4.5H26.501V43.5H21.5z" transform="rotate(45.001 24 24)" /><path fill="#F44336" d="M21.5 4.5H26.5V43.501H21.5z" transform="rotate(135.008 24 24)" /></svg>
          </button>
        </div>
        <div class="list-form-body">
          <label class="form-label" for="list-title-input">Name</label>
              <input required type="text" class="form-control" id="list-title-input" value="" />
            <label class="form-label" for="list-date-input">Date</label>
              <input type="date" class="form-control" id="list-date-input" value="" />
            <label class="form-label" for="list-description-input">Description</label>
              <textarea class="form-control" id="list-description-input" cols="30" rows="5"></textarea>
        </div>
            <div class="form-footer">
          <button id="add-or-update-list-btn" class="btn large-btn" type="submit">
            Create List
          </button>
        </div>
      </form>
      <dialog id="confirm-close-dialog">
        <form method="dialog">
          <p class="discard-message-text">Discard unsaved changes?</p>
          <div class="confirm-close-dialog-btn-container">
            <button id="cancel-btn" class="btn">
              Cancel
            </button>
            <button id="discard-btn" class="btn">
              Discard
            </button>
          </div>
        </form>
      </dialog>
      <div id="project-dashboard" class="dashboard">
        <div class="form-btn-div">
          <button id="edit-project-btn" class="btn">edit project</button>
          <button id="delete-project-btn" class="btn">delete project</button>
        </div>
        <div class="dashboard-header">
          <div class="title-and-add">
            <h3 class="dashboard-title"></h3>
            <button class="add-task-inline-btn btn">+ add task</button>
          </div>
          <p class="dashboard-description"></p>
        </div>
        <div class="filtered-task-list"></div>
      </div>
      <div id="list-dashboard" class="dashboard">
        <div class="form-btn-div">
          <button id="edit-list-btn" class="btn">edit list</button>
          <button id="delete-list-btn" class="btn">delete list</button>   
        </div>
        <div class="dashboard-header">
          <div class="title-and-add">
            <h3 class="dashboard-title"></h3>
            <button class="add-task-inline-btn btn">+ add task</button>
          </div>
          <p class="dashboard-description"></p>
        </div>
        <div class="filtered-task-list"></div>
      </div>
      <div id="tasks-container"></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>

</html>
