<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do Shit</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header id="site-header">
    <div id="logo-and-title">
      <button id="logo" aria-label="close" type="button"><span class="poop">💩</span></button>
      <h1>Do Shit</h1>
    </div>
    <div id="search-and-sort">
      <input type="search" id="search" name="search" placeholder="search tasks, projects, lists" />
      <div id="chips">
        <button id="sort-alpha" class="chip">A-Z</button>
        <button id="sort-due-first" class="chip">Due: first-last</button>
      </div>
    </div>
    <div class="menu-wrapper">
      <button id="add-new-btn" type='button' aria-label='create new item' aria-controls='button dropdown' aria-expanded="false">Create</button>
      <div id="button-dropdown" class="menu-panel">
        <button id="open-task-form-btn" type="btn">New Task</button>
        <button id="open-project-form-btn" type="btn">New Project</button>
        <button id="open-list-form-btn" type="btn">New List</button>
      </div>
    </div>
  </header>
  <main>
    <div class="menu-sidebar">
      <div class="projects">
        <div id='projects-header-sidebar'>
          <h3>Projects</h3>
          <button title='Create a new project' class="icon-btn" ><i id="project-icon-toggle" data-feather="folder-plus"></i></button>
        </div>
        <!-- <button id="delete-projects-btn">delete projects</button> -->
        <div id="project-container"></div>
      </div>
      <div class="lists">
        <div id="lists-header-sidebar">
           <h3>Lists</h3>
           <button title='Create a new list' class="icon-btn" ><i id="list-icon-toggle" data-feather="file-plus"></i></button>
        </div>       
        <!-- <button id="delete-lists-btn">delete lists</button> -->
        <div id="list-container"></div>
      </div>
    </div>
    <div class="todo-app">
      <div id="task-form-home">
        <form class="form hidden" id="task-form" data-type="task">
          <div class="task-form-header">
            <button id="close-task-form-btn" class="close-form-btn" type="button" aria-label="close">
              <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#F44336" d="M21.5 4.5H26.501V43.5H21.5z" transform="rotate(45.001 24 24)" /><path fill="#F44336" d="M21.5 4.5H26.5V43.501H21.5z" transform="rotate(135.008 24 24)" /></svg>
            </button>
          </div>
          <div class="task-form-body">
              <label class="form-label" for="task-title-input" >Name</label>
              <input required type="text" class="form-control" id="task-title-input" name="title" value="" />
              <label class="form-label" for="task-date-input">Date</label>
              <input type="date" class="form-control" id="task-date-input" name="date" value="" />
              <label class="form-label" for="task-project-input">Project</label>
              <input type="text" class="form-control" id="task-project-input" name="project" value="" />
              <label class="form-label" for="task-list-input">List</label>
              <input type="text" class="form-control" id="task-list-input" name="list" value="" />
              <label class="form-label" for="task-parent-input">Parent task?</label>
              <input type="text" class="form-control" id="task-parent-input" name="parent-task" value="" />
              <label class="form-label" for="task-description-input">Description</label>
              <textarea class="form-control" name="description" id="task-description-input" cols="30" rows="5"></textarea>
          </div>
          <div class="task-form-footer">
            <button id="add-or-update-task-btn" class="btn large-btn" type="submit">
              Add Task
            </button>
          </div>
        </form>
      </div>
      <form class="form hidden" id="project-form" data-type="project">
        <div class="project-form-header">
          <button id="close-project-form-btn" class="close-form-btn" type="button" aria-label="close">
            <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#F44336" d="M21.5 4.5H26.501V43.5H21.5z" transform="rotate(45.001 24 24)" /><path fill="#F44336" d="M21.5 4.5H26.5V43.501H21.5z" transform="rotate(135.008 24 24)" /></svg>
          </button>
        </div>
        <div class ='project-form-body'>
          <label class="form-label" for="project-title-input">Name</label>
              <input required type="text" class="form-control" id="project-title-input" name="title" value="" />
            <label class="form-label" for="project-date-input">Date</label>
              <input type="date" class="form-control" id="project-date-input" name="date" value="" />
            <label class="form-label" for="project-description-input">Description</label>
              <textarea class="form-control" name="description" id="project-description-input" cols="30" rows="5"></textarea>
          </div>
            <div class="form-footer">
          <button id="add-or-update-project-btn" class="btn large-btn" type="submit">
            Create Project
          </button>
        </div>
      </form>
      <form class="form hidden" id="list-form" data-type="list">
        <div class="list-form-header">
          <button id="close-list-form-btn" class="close-form-btn" type="button" aria-label="close">
            <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px" height="48px"><path fill="#F44336" d="M21.5 4.5H26.501V43.5H21.5z" transform="rotate(45.001 24 24)" /><path fill="#F44336" d="M21.5 4.5H26.5V43.501H21.5z" transform="rotate(135.008 24 24)" /></svg>
          </button>
        </div>
        <div class="list-form-body">
          <label class="form-label" for="list-title-input">Name</label>
              <input required type="text" class="form-control" id="list-title-input" name="title" value="" />
            <label class="form-label" for="list-date-input">Date</label>
              <input type="date" class="form-control" id="list-date-input" name="date" value="" />
            <label class="form-label" for="list-description-input">Description</label>
              <textarea class="form-control" name="description" id="list-description-input" cols="30" rows="5"></textarea>
        </div>
            <div class="form-footer">
          <button id="add-or-update-list-btn" class="btn large-btn" type="submit">
            Create List
          </button>
        </div>
      </form>
      <dialog id="confirm-close-dialog">
        <form method="dialog">
          <p class="discard-message-text">Discard unsaved changes?</p>
          <div class="confirm-close-dialog-btn-container">
            <button id="cancel-btn" class="btn">
              Cancel
            </button>
            <button id="discard-btn" class="btn">
              Discard
            </button>
          </div>
        </form>
      </dialog>
      <div id="project-dashboard" class="dashboard">
        <div class="form-btn-div">
          <button id="edit-project-btn" class="btn">edit project</button>
          <button id="delete-project-btn" class="btn">delete project</button>
        </div>
        <div class="dashboard-header">
          <div class="title-and-add">
            <h3 class="dashboard-title"></h3>
            <button class="add-task-inline-btn btn">+ add task</button>
          </div>
          <p class="dashboard-description"></p>
        </div>
        <div class="filtered-task-list"></div>
      </div>
      <div id="list-dashboard" class="dashboard">
        <div class="form-btn-div">
          <button id="edit-list-btn" class="btn">edit list</button>
          <button id="delete-list-btn" class="btn">delete list</button>   
        </div>
        <div class="dashboard-header">
          <div class="title-and-add">
            <h3 class="dashboard-title"></h3>
            <button class="add-task-inline-btn btn">+ add task</button>
          </div>
          <p class="dashboard-description"></p>
        </div>
        <div class="filtered-task-list"></div>
      </div>
      <div id="tasks-container">
      </div>
    </div>
  </main>
  <script src="libraries/feather.js"></script>
  <script src="script.js"></script>
</body>

</html>
